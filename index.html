<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học Tiếng Pháp Qua Video YouTube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Khung video sạch hoàn toàn, không đặt nút nổi đè lên thanh điều khiển YouTube */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .video-wrapper iframe,
    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Thanh công cụ nằm tách biệt bên dưới khung video (Cách khắc phục 1) */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #1e293b;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:hover {
      background: #475569;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Trạng thái nút Ghim đang bật */
    .btn.pinned {
      background: #f59e0b;
      color: #0f172a;
      border-color: #fbbf24;
      font-weight: 700;
    }

    /* Trạng thái nút Lặp câu / Phụ đề đang bật */
    .btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .btn-success {
      background: #059669;
      border-color: #10b981;
    }

    .btn-success:hover {
      background: #047857;
    }

    .btn-danger {
      background: #dc2626;
      border-color: #ef4444;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    /* Khu vực hiển thị phụ đề tiếng Pháp */
    .subtitle-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px 20px;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .subtitle-box:hover {
      border-color: #60a5fa;
    }

    .subtitle-box.hidden {
      display: none;
    }

    .subtitle-text {
      font-size: 20px;
      line-height: 1.5;
      font-weight: 500;
      color: #f8fafc;
    }

    .subtitle-hint {
      margin-top: 6px;
      font-size: 12px;
      color: #94a3b8;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
      padding: 0 4px;
    }

    /* Khi bật Toàn màn hình cho toàn bộ khu vực học */
    .app-container:fullscreen {
      max-width: 100%;
      height: 100vh;
      background: #000;
      padding: 12px;
      justify-content: center;
    }

    .app-container:fullscreen .video-wrapper {
      flex: 1;
      aspect-ratio: auto;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- Thông tin video hiện tại -->
    <div class="video-meta">
      <span id="video-title">Chưa có dữ liệu — Hãy bấm "Tải file" để nạp JSON</span>
      <span id="video-stats">Còn lại: 0 | Đã xem: 0</span>
    </div>

    <!-- Khung Video YouTube (Không còn nút nổi đè lên góc phải dưới) -->
    <div class="video-wrapper">
      <div id="player"></div>
    </div>

    <!-- Thanh điều khiển bên dưới video -->
    <div class="toolbar">
      <!-- Nhóm nút tính năng học & ghim -->
      <div class="toolbar-group">
        <button id="btn-pin" class="btn" onclick="togglePinVideo()" title="Ghim video này để lần sau mở web vẫn giữ nguyên">
          📌 Ghim video
        </button>
        <button id="btn-loop" class="btn" onclick="toggleLoopSentence()" title="Lặp lại câu phụ đề hiện tại">
          🔁 Lặp câu
        </button>
        <button id="btn-sub" class="btn active" onclick="toggleSubtitleBox()" title="Ẩn/hiện khung phụ đề tiếng Pháp">
          💬 PĐ
        </button>
        <button id="btn-fullscreen" class="btn" onclick="toggleFullScreen()" title="Toàn màn hình kèm phụ đề">
          ⛶ Toàn màn hình
        </button>
      </div>

      <!-- Nhóm nút điều hướng & dữ liệu -->
      <div class="toolbar-group">
        <button class="btn" onclick="playNextRandomVideo()" title="Chuyển sang video ngẫu nhiên khác">
          ⏭ Đổi video
        </button>
        <button class="btn btn-success" onclick="markVideoStatus('watched')" title="Đánh dấu đã xem và chuyển video">
          ✅ Đã xem
        </button>
        <button class="btn btn-danger" onclick="markVideoStatus('skipped')" title="Bỏ qua video này">
          ⏩ Bỏ qua
        </button>
        <label class="btn" style="cursor: pointer;" title="Nạp file du_lieu_tong_hop.json">
          📂 <span id="btn-load-label">Tải file (0)</span>
          <input type="file" id="file-input" accept=".json" style="display: none;" onchange="handleFileUpload(event)" />
        </label>
        <button class="btn" onclick="exportUpdatedJson()" title="Tải về file JSON đã cập nhật tiến độ">
          💾 Lưu JSON
        </button>
      </div>
    </div>

    <!-- Khung hiển thị phụ đề đồng bộ -->
    <div class="subtitle-box" id="subtitle-box" onclick="replayCurrentSentence()" title="Bấm vào câu để nghe lại">
      <div class="subtitle-text" id="subtitle-text">...</div>
      <div class="subtitle-hint">Bấm vào khung phụ đề để nghe lại câu hiện tại</div>
    </div>
  </div>

  <!-- Nạp YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const PINNED_KEY = 'yt_french_pinned_video_id';
    const DATA_CACHE_KEY = 'yt_french_cached_data';

    let player = null;
    let isPlayerReady = false;
    let allData = { videos: [], skipped_ids: [], watched_ids: [] };
    let currentVideo = null;
    let currentSubtitles = [];
    let activeSubIndex = -1;
    let isLoopingSentence = false;
    let isSubtitleVisible = true;
    let syncTimer = null;

    // 1. Khởi tạo YouTube Player khi API sẵn sàng
    function onYouTubeIframeAPIReady() {
      isPlayerReady = true;
      restoreFromCache();
    }

    // 2. Khôi phục dữ liệu & video đã ghim khi mở lại web
    function restoreFromCache() {
      const cached = localStorage.getItem(DATA_CACHE_KEY);
      if (!cached) return;

      try {
        const parsed = JSON.parse(cached);
        allData = normalizeData(parsed);
        updateStatsUI();

        const initialVideo = pickInitialVideo();
        if (initialVideo) {
          loadVideo(initialVideo);
        }
      } catch (e) {
        console.error('Lỗi đọc cache:', e);
      }
    }

    // Chuẩn hóa cấu trúc dữ liệu từ du_lieu_tong_hop.json
    function normalizeData(raw) {
      if (Array.isArray(raw)) {
        return { videos: raw, skipped_ids: [], watched_ids: [] };
      }
      return {
        videos: raw.videos || [],
        skipped_ids: raw.skipped_ids || [],
        watched_ids: raw.watched_ids || []
      };
    }

    // 3. Chọn video khi mở web: Ưu tiên tuyệt đối video đang được ghim
    function pickInitialVideo() {
      if (!allData.videos.length) return null;

      const pinnedId = localStorage.getItem(PINNED_KEY);
      if (pinnedId) {
        const pinnedVideo = allData.videos.find(v => v.id === pinnedId);
        if (pinnedVideo) {
          return pinnedVideo;
        }
      }

      return getRandomAvailableVideo();
    }

    function getRandomAvailableVideo() {
      const available = allData.videos.filter(
        v => !allData.skipped_ids.includes(v.id) && !allData.watched_ids.includes(v.id)
      );
      if (!available.length) return allData.videos[0] || null;
      return available[Math.floor(Math.random() * available.length)];
    }

    // 4. Nạp video vào YouTube Player
    function loadVideo(video) {
      if (!video) return;
      currentVideo = video;
      currentSubtitles = extractSubtitles(video);
      activeSubIndex = -1;

      document.getElementById('video-title').textContent = video.title || `Video ID: ${video.id}`;
      document.getElementById('subtitle-text').textContent = currentSubtitles.length
        ? 'Đang phát video...'
        : 'Video này chưa có dữ liệu phụ đề trong JSON';

      updatePinButtonUI();

      if (!isPlayerReady) return;

      if (player) {
        player.loadVideoById(video.id);
      } else {
        player = new YT.Player('player', {
          videoId: video.id,
          playerVars: {
            autoplay: 1,
            controls: 1,
            cc_load_policy: 0, // Tắt tự bật phụ đề gốc của YouTube
            hl: 'fr',
            rel: 0,
            modestbranding: 1
          },
          events: {
            onReady: (e) => {
              forceDisableYouTubeCaptions(e);
              startSubtitleSync();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) {
                forceDisableYouTubeCaptions(e);
              }
            }
          }
        });
      }
    }

    // Ép tắt module phụ đề gốc của YouTube để không bị chồng chữ
    function forceDisableYouTubeCaptions(event) {
      const yt = event?.target || player;
      if (!yt) return;
      try {
        yt.unloadModule('captions');
        yt.unloadModule('cc');
      } catch (e) {}
    }

    // 5. Tính năng GHIM VIDEO
    function togglePinVideo() {
      if (!currentVideo) return;
      const currentPinnedId = localStorage.getItem(PINNED_KEY);

      if (currentPinnedId === currentVideo.id) {
        localStorage.removeItem(PINNED_KEY);
      } else {
        localStorage.setItem(PINNED_KEY, currentVideo.id);
        saveCache();
      }
      updatePinButtonUI();
    }

    function updatePinButtonUI() {
      const btn = document.getElementById('btn-pin');
      if (!btn) return;

      const isPinned = currentVideo && localStorage.getItem(PINNED_KEY) === currentVideo.id;
      if (isPinned) {
        btn.classList.add('pinned');
        btn.innerHTML = '📌 Đã ghim';
      } else {
        btn.classList.remove('pinned');
        btn.innerHTML = '📌 Ghim video';
      }
    }

    // 6. Đồng bộ phụ đề & Lặp câu
    function extractSubtitles(video) {
      const list = video.subtitles || video.transcript || video.captions || video.segments || [];
      return list.map((item, idx) => {
        const start = Number(item.start ?? item.startTime ?? 0);
        const end = item.end !== undefined
          ? Number(item.end)
          : (item.dur !== undefined ? start + Number(item.dur) : (list[idx + 1]?.start ?? start + 4));
        return {
          start,
          end,
          text: item.text || item.content || item.fr || ''
        };
      });
    }

    function startSubtitleSync() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function' || !currentSubtitles.length) return;
        const currentTime = player.getCurrentTime();

        // Nếu đang bật lặp câu và đã chạy hết câu hiện tại -> tua lại đầu câu
        if (isLoopingSentence && activeSubIndex >= 0) {
          const lockedSub = currentSubtitles[activeSubIndex];
          if (lockedSub && currentTime >= lockedSub.end) {
            player.seekTo(lockedSub.start, true);
            return;
          }
        }

        const foundIdx = currentSubtitles.findIndex(
          s => currentTime >= s.start && currentTime <= s.end
        );

        if (foundIdx !== -1 && foundIdx !== activeSubIndex) {
          activeSubIndex = foundIdx;
          document.getElementById('subtitle-text').textContent = currentSubtitles[foundIdx].text;
        }
      }, 100);
    }

    function toggleLoopSentence() {
      isLoopingSentence = !isLoopingSentence;
      const btn = document.getElementById('btn-loop');
      btn.classList.toggle('active', isLoopingSentence);
    }

    function replayCurrentSentence() {
      if (!player || activeSubIndex < 0 || !currentSubtitles[activeSubIndex]) return;
      player.seekTo(currentSubtitles[activeSubIndex].start, true);
      player.playVideo();
    }

    function toggleSubtitleBox() {
      isSubtitleVisible = !isSubtitleVisible;
      document.getElementById('subtitle-box').classList.toggle('hidden', !isSubtitleVisible);
      document.getElementById('btn-sub').classList.toggle('active', isSubtitleVisible);
    }

    function toggleFullScreen() {
      const container = document.getElementById('app-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // 7. Chuyển video, đánh dấu Đã xem / Bỏ qua & Nạp/Xuất JSON
    function playNextRandomVideo() {
      const next = getRandomAvailableVideo();
      if (next) loadVideo(next);
    }

    function markVideoStatus(type) {
      if (!currentVideo) return;
      const id = currentVideo.id;

      // Nếu video đang được ghim mà người dùng bấm Đã xem / Bỏ qua -> tự động bỏ ghim
      if (localStorage.getItem(PINNED_KEY) === id) {
        localStorage.removeItem(PINNED_KEY);
      }

      if (type === 'watched' && !allData.watched_ids.includes(id)) {
        allData.watched_ids.push(id);
      } else if (type === 'skipped' && !allData.skipped_ids.includes(id)) {
        allData.skipped_ids.push(id);
      }

      saveCache();
      updateStatsUI();
      playNextRandomVideo();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          allData = normalizeData(parsed);
          saveCache();
          updateStatsUI();

          const videoToPlay = pickInitialVideo();
          if (videoToPlay) loadVideo(videoToPlay);
        } catch (err) {
          alert('File JSON không hợp lệ!');
        }
      };
      reader.readAsText(file);
    }

    function saveCache() {
      localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(allData));
    }

    function updateStatsUI() {
      const remaining = allData.videos.filter(
        v => !allData.skipped_ids.includes(v.id) && !allData.watched_ids.includes(v.id)
      ).length;

      document.getElementById('btn-load-label').textContent = `Tải file (${remaining})`;
      document.getElementById('video-stats').textContent =
        `Còn lại: ${remaining} | Đã xem: ${allData.watched_ids.length} | Bỏ qua: ${allData.skipped_ids.length}`;
    }

    function exportUpdatedJson() {
      const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'du_lieu_tong_hop.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
